apiVersion: controlplane.cluster.x-k8s.io/v1beta1
kind: KubeadmControlPlane
metadata:
  name: ptc-control-plane
  namespace: default
spec:
  replicas: 1
  version: v1.30.0
  machineTemplate:
    infrastructureRef:
      apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
      kind: PTCMachineTemplate
      name: ptc-control-plane-machinetemplate
  kubeadmConfigSpec:
    preKubeadmCommands:
      # 0. Load required kernel modules
      - modprobe overlay
      - modprobe br_netfilter
      - printf "overlay\nbr_netfilter\n" > /etc/modules-load.d/k8s.conf
      
      # 0.1. Enable IPv4 forwarding and bridge netfilter settings
      - sysctl -w net.ipv4.ip_forward=1
      - sysctl -w net.bridge.bridge-nf-call-iptables=1
      - sysctl -w net.bridge.bridge-nf-call-ip6tables=1
      - printf "net.ipv4.ip_forward = 1\nnet.bridge.bridge-nf-call-iptables = 1\nnet.bridge.bridge-nf-call-ip6tables = 1\n" > /etc/sysctl.d/k8s.conf
      
      # 1. Install prerequisites & containerd
      - apt-get update && apt-get install -y apt-transport-https ca-certificates curl gnupg containerd
      - mkdir -p /etc/containerd && containerd config default > /etc/containerd/config.toml
      - sed -i 's/SystemdCgroup = false/SystemdCgroup = true/g' /etc/containerd/config.toml
      - systemctl restart containerd
      - systemctl enable containerd
      # 2. Add Kubernetes apt repository (v1.30)
      - mkdir -p -m 755 /etc/apt/keyrings
      - curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.30/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      - echo 'deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.30/deb/ /' > /etc/apt/sources.list.d/kubernetes.list
      # 3. Install K8s tools
      - apt-get update
      - apt-get install -y kubelet kubeadm kubectl
      - apt-mark hold kubelet kubeadm kubectl
    initConfiguration:
      localAPIEndpoint:
        bindPort: 6443
      nodeRegistration:
        criSocket: /run/containerd/containerd.sock
        kubeletExtraArgs:
          anonymous-auth: "false"
    clusterConfiguration:
      apiServer:
        certSANs:
          - "10.220.112.151"              # <--- Add VIP to TLS cert SANs
    joinConfiguration:
      nodeRegistration:
        criSocket: /run/containerd/containerd.sock


